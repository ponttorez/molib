# Build checks on every desktop OS, the NuGet package, and publishing on a version tag.
# ADR: adr/foundation/ci.md
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Molib.slnx -c Release

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format Molib.slnx --verify-no-changes --no-restore

  pack:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/Molib -c Release -o artifacts

      - name: Check package contents
        run: |
          packages=(artifacts/Molib.*[0-9].nupkg)
          package=${packages[0]}
          test -f "$package"
          test -f "${package%.nupkg}.snupkg"
          contents=$(unzip -l "$package")
          for file in lib/net10.0/Molib.dll lib/net10.0/Molib.xml README.md; do
            echo "$contents" | grep -q " $file$" || { echo "missing $file in $package"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pack]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg" --skip-duplicate
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
